[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "presence-ai"
version = "2.0.0"
description = "Face + Voice Biometric Attendance Platform for Universities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "supabase>=2.3.0",
    "dlib>=19.24.0",
    "resemblyzer>=0.1.4",
    "librosa>=0.10.0",
    "soundfile>=0.12.1",
    "scikit-learn>=1.3.0",
    "opencv-python-headless>=4.8.0",
    "python-multipart>=0.0.9"
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "frontend",
    "node_modules",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F401", "E402", "E741", "F841"]

[tool.black]
line-length = 100
target-version = ["py313"]
exclude = '''
/(
    \.git
  | \.pytest_cache
  | __pycache__
  | frontend
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/database/config.py",
    "src/utiils.py",
    "*/__pycache__/*",
    "*/tests/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 45

