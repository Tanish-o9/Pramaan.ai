name: Pramaan CI/CD Quality Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Dependencies (CMake, Build Essential)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libopenblas-dev liblapack-dev libsndfile1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx ruff black

      - name: Run Ruff Linting
        run: |
          ruff check src/ tests/

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest --cov=src --cov-report=term-missing tests/
        env:
          JWT_SECRET_KEY: "ci-test-jwt-secret-key-32chars-minimum!!"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vY2siLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcwMDAwMDAwMCwiZXhwIjoyMDAwMDAwMDAwfQ.mock_signature_for_ci_testing_only"

  frontend-qa:
    name: Frontend Lint & Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: ./frontend
        run: npm test

      - name: Build Production Client
        working-directory: ./frontend
        run: npm run build

